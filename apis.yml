aid: zayzoon
name: ZayZoon
description: 'ZayZoon is an Earned Wage Access (EWA) and financial-wellness provider,
  founded in 2014 with offices in Calgary, Alberta and Scottsdale, Arizona, that lets
  employees of participating businesses draw a portion of already-earned wages before
  payday. The product is distributed through payroll, PEO and HCM platforms — ZayZoon
  advertises 300+ payroll and HCM integrations and is listed on the ADP Marketplace,
  isolved Network, AllianceHCM, PrismHR, Paylocity and Execupay — and is free for employers,
  with employees paying a flat per-transfer processing fee or choosing a fee-free option
  (Boost gift cards, ZayZoon Visa prepaid card). ZayZoon operates a partner API used
  by payroll providers to exchange employee, hours-worked and deduction data, but it
  publishes no public developer portal, API reference or machine-readable specification;
  access is arranged through the partner program. NMLS ID 2635812.'
