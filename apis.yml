  detail: >-
    ZayZoon runs a real partner API — api.zayzoon.com resolves and its payroll/HCM
    integrations are marketed on its own partner pages — but the only published route to
    it is the "Partner with ZayZoon" inquiry form; there is no developer portal, no API
    reference and no machine-readable contract on any ZayZoon host, and the API host
    itself serves robots.txt "Disallow: /" and redirects anonymous requests to a customer
    sign-in page.
